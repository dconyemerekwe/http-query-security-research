services:
  nginx:
    image: nginx:1.30.8
    ports: 
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - varnish

  varnish:
    image: varnish:9.1
    volumes:
      - ./docker/default.vcl:/etc/varnish/default.vcl:ro
    depends_on:
      - app

  app:
    build: .